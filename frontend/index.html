<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourTally — Tour Expense Tracker</title>
    <meta name="description" content="Open-source, self-hosted tour expense tracker and split management system." />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/dark/svg/favicon-dark.svg" id="tourtally-dynamic-favicon" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Bootstrap 5.3.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons 1.11.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Toastr 2.1.4 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />

    <!-- Prevent FOUC: apply saved theme and favicon instantly before React mounts -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-bs-theme', saved);
          const favicon = document.getElementById('tourtally-dynamic-favicon');
          if (favicon) {
            favicon.setAttribute('href', saved === 'dark' ? '/icons/dark/svg/favicon-dark.svg' : '/icons/light/svg/favicon-light.svg');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- jQuery 3.7.1 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Toastr 2.1.4 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- React App Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
